<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{if .Title}}{{.Title}} · {{end}}nanoinfra skills</title>
  <meta name="theme-color" content="#f6f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/static/brand/nanoinfra_mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/skills-server.css">
  <!-- Loaded by src rather than inline: the preview view renders untrusted
       SKILL.md, and the tests assert no live script tag reaches the response.
       An inline block in the chrome would defeat that check on every page. -->
  <script src="/static/theme.js"></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li>
          <a href="/" class="brand">
            <img src="/static/brand/nanoinfra_logo.svg" alt="nanoinfra" width="1300" height="220">
            <small>skills</small>
          </a>
        </li>
      </ul>
      <ul>
        <li><a href="/skills">Browse skills</a></li>
        {{if .User}}
          <li><a href="/submit">Submit a skill</a></li>
          <li><a href="/my/submissions">My submissions</a></li>
          {{if .User.IsAdmin}}<li><a href="/admin">Admin dashboard</a></li>{{end}}
          <li>
            <form method="post" action="/auth/logout" style="display:inline">
              <button type="submit" class="secondary outline">Log out ({{.User.Email}})</button>
            </form>
          </li>
        {{else}}
          <li><a href="/auth/google/login" role="button">Sign in with Google</a></li>
        {{end}}
        <li>
          <button type="button" id="theme-toggle" aria-label="Switch between light and dark">
            <span aria-hidden="true"></span>
          </button>
        </li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {{template "content" .}}
  </main>
  <footer class="container">
    <small>
      <a href="https://nanoinfra.org/skills/">About this catalog</a> &middot;
      <a href="https://github.com/nanoinfraorg/skills-server">skills-server</a> &middot;
      part of <a href="https://nanoinfra.org">nanoinfra</a>
    </small>
  </footer>
</body>
</html>
